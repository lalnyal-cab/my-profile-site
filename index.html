<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>프로필 | 홍길동</title>
  <meta name="description" content="프론트엔드 개발자 프로필 포트폴리오" />

  <!-- 폰트: Pretendard (한글) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'Inter', 'system-ui', 'sans-serif'] },
          colors: { brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="css/style.css" />

  <!-- 다크모드 깜빡임 방지: 페이지 렌더 전에 테마 적용 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>

<body class="bg-slate-200 text-slate-800 dark:bg-black dark:text-slate-200 antialiased">

  <!-- 상단 바 (모바일 폭 기준 중앙 고정) -->
  <header id="navbar" class="fixed left-1/2 top-0 z-50 flex h-14 w-full max-w-[430px] -translate-x-1/2 items-center justify-end border-b border-transparent px-5 transition-all duration-300">
    <button id="theme-toggle" type="button" aria-label="다크모드 전환"
      class="grid h-9 w-9 place-items-center rounded-full border border-slate-200 bg-white/70 backdrop-blur transition hover:scale-105 dark:border-slate-700 dark:bg-slate-900/70">
      <svg class="icon-sun hidden h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon hidden h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <!-- 앱 컨테이너: 모바일 폭(430px) 고정 -->
  <div id="app" class="relative mx-auto min-h-screen max-w-[430px] overflow-x-hidden bg-slate-50 pb-28 shadow-2xl dark:bg-slate-950">
    <main>
      <!-- Hero -->
      <section id="home" class="relative overflow-hidden px-5 pt-24 pb-12">
        <div class="pointer-events-none absolute inset-x-0 top-0 -z-10 h-80 bg-gradient-to-b from-brand-500/15 to-transparent dark:from-brand-500/20"></div>

        <!-- 프로필 사진: img/profile.jpg 파일을 넣으면 자동으로 표시됨 -->
        <div class="reveal mx-auto w-44">
          <div class="relative">
            <div class="absolute -inset-4 rounded-full bg-gradient-to-tr from-brand-500 to-violet-500 opacity-20 blur-2xl"></div>
            <div class="relative aspect-square overflow-hidden rounded-3xl border border-white/60 bg-slate-200 shadow-xl dark:border-slate-700 dark:bg-slate-800">
              <img src="img/profile.jpg" alt="홍길동 프로필 사진" class="h-full w-full object-cover"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
              <div class="h-full w-full items-center justify-center" style="display:none" aria-hidden="true">
                <svg viewBox="0 0 200 200" class="h-3/4 w-3/4 text-slate-400 dark:text-slate-500" fill="currentColor">
                  <circle cx="100" cy="78" r="38"/>
                  <path d="M30 190c0-42 31-70 70-70s70 28 70 70z"/>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-8 text-center">
          <p class="reveal inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/70 px-3 py-1 text-xs text-slate-600 backdrop-blur dark:border-slate-700 dark:bg-slate-900/70 dark:text-slate-400">
            <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
            <span id="hero-role">Available for work</span>
          </p>
          <h1 class="reveal mt-4 text-3xl font-extrabold tracking-tight">
            안녕하세요, <span class="bg-gradient-to-r from-brand-600 to-violet-500 bg-clip-text text-transparent dark:from-brand-500 dark:to-violet-400" id="hero-name">이름</span>입니다.
          </h1>
          <div id="hero-intro" class="reveal mt-4 space-y-1 text-sm text-slate-600 dark:text-slate-400"></div>

          <div class="reveal mt-6 flex justify-center gap-3">
            <a href="#projects" class="rounded-xl bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-brand-600/25 transition active:scale-95 hover:bg-brand-700">프로젝트 보기</a>
            <a href="#contact" class="rounded-xl border border-slate-300 bg-white/70 px-5 py-2.5 text-sm font-semibold backdrop-blur transition active:scale-95 dark:border-slate-700 dark:bg-slate-900/70">연락하기</a>
          </div>
        </div>
      </section>

      <!-- About -->
      <section id="about" class="px-5 py-12">
        <div class="reveal">
          <p class="section-eyebrow">About</p>
          <h2 class="section-title">소개</h2>
        </div>
        <p id="about-text" class="reveal mt-5 text-base leading-relaxed text-slate-600 dark:text-slate-400"></p>
      </section>

      <!-- Skills -->
      <section id="skills" class="px-5 py-12">
        <div class="reveal">
          <p class="section-eyebrow">Skills</p>
          <h2 class="section-title">기술 스택</h2>
        </div>
        <ul id="skills-list" class="mt-6 grid grid-cols-1 gap-3"></ul>
      </section>

      <!-- Projects -->
      <section id="projects" class="px-5 py-12">
        <div class="reveal">
          <p class="section-eyebrow">Projects</p>
          <h2 class="section-title">프로젝트</h2>
        </div>
        <div id="projects-list" class="mt-6 grid grid-cols-1 gap-5"></div>
      </section>

      <!-- Contact -->
      <section id="contact" class="px-5 py-12">
        <div class="reveal rounded-3xl border border-slate-200 bg-white p-6 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900">
          <p class="section-eyebrow">Contact</p>
          <h2 class="section-title">함께 이야기해요</h2>
          <p class="mx-auto mt-3 text-sm text-slate-600 dark:text-slate-400">새로운 기회나 협업, 질문이 있다면 편하게 연락 주세요.</p>
          <div class="mt-6 flex flex-col gap-3">
            <a id="contact-email" href="#" class="rounded-xl bg-brand-600 px-6 py-3 font-semibold text-white transition active:scale-95 hover:bg-brand-700">이메일 보내기</a>
            <a id="contact-github" href="#" target="_blank" rel="noopener noreferrer" class="rounded-xl border border-slate-300 px-6 py-3 font-semibold transition active:scale-95 dark:border-slate-700">GitHub</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="px-5 py-8 text-center text-xs text-slate-500 dark:text-slate-500">
      <p>&copy; <span id="year"></span> <span id="footer-name">홍길동</span>. All rights reserved.</p>
    </footer>
  </div>

  <!-- 하단 탭바 (앱 스타일, 모바일 폭 기준 중앙 고정) -->
  <nav id="tabbar" aria-label="하단 메뉴"
    class="fixed bottom-0 left-1/2 z-50 w-full max-w-[430px] -translate-x-1/2 border-t border-slate-200 bg-white/85 pb-[env(safe-area-inset-bottom)] backdrop-blur-md dark:border-slate-800 dark:bg-slate-950/85">
    <ul class="grid grid-cols-5">
      <li><a href="#home" class="tab-link"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>홈</span></a></li>
      <li><a href="#about" class="tab-link"><svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM4 21a8 8 0 0116 0"/></svg><span>소개</span></a></li>
      <li><a href="#skills" class="tab-link"><svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg><span>기술</span></a></li>
      <li><a href="#projects" class="tab-link"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg><span>프로젝트</span></a></li>
      <li><a href="#contact" class="tab-link"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 6l8 6 8-6"/></svg><span>연락처</span></a></li>
    </ul>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
